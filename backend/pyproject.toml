[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construct-analysis"
version = "0.1.0"
description = "Error detection for construction bills of quantities: deterministic checks, dependency checks and LLM checks"
requires-python = ">=3.10"
# lxml is needed to read GAEB files through the importer (importer/ must be in the checkout).
dependencies = ["pydantic>=2.8,<3", "lxml>=5"]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2"]
test = ["pytest>=8"]
# Layer 3 through the Anthropic API (opt-in; the default local provider, Ollama, needs no package).
llm-api = ["anthropic>=2.12,<3"]

[project.scripts]
construct-analysis = "analysis.__main__:main"
gaeb-check = "analysis.layer2.cli:main"

[tool.setuptools.packages.find]
include = ["analysis*"]

[tool.setuptools.package-data]
"analysis.layer2" = ["rules.json"]
"analysis.layer3" = ["eval_cases.json"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
