# Production stack for a VPS: PostgreSQL -> migrations -> backend API -> web (Caddy: HTTPS, password,
# frontend files, /api proxy).
# Manage it with ./deploy.sh rather than calling this file directly.
name: tenderdesk

x-postgres-image: &postgres-image postgres:18
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
x-app-db: &app-db
  PGHOST: db
  PGDATABASE: ${POSTGRES_DB:-construction}
  PGUSER: construction_app
  PGPASSWORD: ${POSTGRES_APP_PASSWORD:?Run ./deploy.sh init first}

services:
  db:
    image: *postgres-image
    <<: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-construction}
      POSTGRES_USER: ${POSTGRES_USER:-construction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./deploy.sh init first}
    # No published port: only services on the internal network can reach PostgreSQL.
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: *postgres-image
    <<: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-construction}
      PGUSER: ${POSTGRES_USER:-construction}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run ./deploy.sh init first}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run ./deploy.sh init first}
    volumes:
      - ./db:/db:ro
    networks: [backend]
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/db/migrate.sql"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    <<: [*hardening, *logging]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *app-db
      ALLOWED_HOSTS: ${APP_DOMAIN:?Set APP_DOMAIN in .env.prod}
      ANALYSIS_L3_PROVIDER: ${ANALYSIS_L3_PROVIDER:-none}
      ANALYSIS_L3_MODEL: ${ANALYSIS_L3_MODEL:-}
      ANALYSIS_L3_TIMEOUT: ${ANALYSIS_L3_TIMEOUT:-45}
      ANALYSIS_L3_MAX_CALLS: ${ANALYSIS_L3_MAX_CALLS:-4}
      ANALYSIS_L3_CACHE: /var/cache/tenderdesk/layer3
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - analysis_cache:/var/cache/tenderdesk/layer3
    networks: [backend, frontend]
    restart: unless-stopped

  # Caddy with the frontend build baked in (deploy/web.Dockerfile). Swap frontend/ and rebuild.
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        FRONTEND_DIST: ${FRONTEND_DIST:-dist}
    <<: *logging
    depends_on:
      backend: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${APP_DOMAIN}}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Run ./deploy.sh init first}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Run ./deploy.sh init first}
    ports:
      - "${HTTP_PUBLISH:-${HTTP_PORT:-80}}:80"
      - "${HTTPS_PUBLISH:-${HTTPS_PORT:-443}}:443"
      - "${HTTPS_PUBLISH:-${HTTPS_PORT:-443}}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Nightly pg_dump into ./backups, keeping BACKUP_KEEP_DAYS days of archives.
  backup:
    image: *postgres-image
    <<: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-construction}
      PGUSER: ${POSTGRES_USER:-construction}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run ./deploy.sh init first}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    networks: [backend]
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          file=/backups/$$PGDATABASE-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump --format=custom --no-owner --no-acl --file="$$file.partial"; then
            mv "$$file.partial" "$$file" && echo "backup written: $$file"
          else
            rm -f "$$file.partial"; echo "backup FAILED" >&2
          fi
          find /backups -name '*.dump' -mtime +"$$KEEP_DAYS" -delete
          sleep 86400
        done
    restart: unless-stopped

  # Optional local inference. Start with ./deploy.sh model and set ANALYSIS_L3_PROVIDER=ollama.
  ollama:
    profiles: ["llm"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    <<: *logging
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    networks: [frontend]
    restart: unless-stopped

  # One-off CLI for bulk imports and seeding: ./deploy.sh seed
  importer:
    profiles: ["tools"]
    build: ./importer
    <<: [*hardening, *logging]
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-db
    networks: [backend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  analysis_cache:
  ollama_models:
