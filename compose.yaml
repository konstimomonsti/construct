x-postgres-image: &postgres-image postgres:18

services:
  db:
    image: *postgres-image
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-construction}
      POSTGRES_USER: ${POSTGRES_USER:-construction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: *postgres-image
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-construction}
      PGUSER: ${POSTGRES_USER:-construction}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run ./db/ops.sh up to set POSTGRES_APP_PASSWORD}
    volumes:
      - ./db:/db:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/db/migrate.sql"]
    restart: "no"

  importer:
    profiles: ["tools"]
    build: ./importer
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-construction}
      PGUSER: construction_app
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?Run ./db/ops.sh up to set POSTGRES_APP_PASSWORD}

volumes:
  postgres_data:
